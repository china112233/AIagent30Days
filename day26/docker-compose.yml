# Day 26: Agent API Docker Compose
# 多服务容器编排配置

version: '3.8'

services:
  # ==========================================
  # Agent API 服务
  # ==========================================
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-api:latest
    ports:
      - "8001:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-network
    restart: unless-stopped

  # ==========================================
  # Redis 缓存服务
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - agent-network
    restart: unless-stopped

  # ==========================================
  # Nginx 负载均衡
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: agent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent-api
    networks:
      - agent-network
    restart: unless-stopped

  # ==========================================
  # Prometheus 监控
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - agent-network
    restart: unless-stopped

# ==========================================
# 网络配置
# ==========================================
networks:
  agent-network:
    driver: bridge

# ==========================================
# 数据卷配置
# ==========================================
volumes:
  redis-data:
  prometheus-data: