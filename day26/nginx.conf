# Nginx 负载均衡配置

events {
    worker_connections 1024;
}

http {
    # 上游服务配置
    upstream agent_backend {
        least_conn;
        server agent-api:8000;
        # 如果有多个实例，可以添加更多
        # server agent-api-2:8000;
        # server agent-api-3:8000;
    }

    # 主服务器配置
    server {
        listen 80;
        server_name localhost;

        # 访问日志
        access_log /var/log/nginx/agent_access.log;
        error_log /var/log/nginx/agent_error.log;

        # Agent API 路由
        location / {
            proxy_pass http://agent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 健康检查端点
        location /health {
            proxy_pass http://agent_backend/health;
            access_log off;
        }

        # API 文档
        location /docs {
            proxy_pass http://agent_backend/docs;
        }

        # OpenAPI 规范
        location /openapi.json {
            proxy_pass http://agent_backend/openapi.json;
        }

        # Prometheus 指标
        location /metrics {
            proxy_pass http://agent_backend/metrics;
        }
    }
}